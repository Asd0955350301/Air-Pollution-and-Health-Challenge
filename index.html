<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8b927">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <title>空氣污染健康影響大挑戰</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #66665f;
      --paper: #fffdf7;
      --cream: #fff8e4;
      --yellow: #ffe07a;
      --yellow-strong: #f8b927;
      --yellow-border: #c99200;
      --orange: #d66816;
      --orange-dark: #97440e;
      --green: #237d44;
      --red: #b3261e;
      --line: #676861;
      --shadow: 0 18px 48px rgba(64, 42, 8, .18);
      font-family: "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }

    button, input, select { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 4px solid #1769aa;
      outline-offset: 3px;
    }

    .screen {
      min-height: 100svh;
      width: 100%;
    }

    .hero-screen {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)),
        url("背景圖.png") center / cover no-repeat;
    }

    .glass-panel {
      width: min(470px, calc(100vw - 32px));
      padding: clamp(26px, 5vw, 44px);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 30px;
      background: rgba(255, 252, 240, .88);
      box-shadow: 0 24px 70px rgba(31, 28, 20, .32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #865013;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { overflow-wrap: anywhere; }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.35rem);
      line-height: 1.13;
      letter-spacing: -.03em;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2.45rem);
      line-height: 1.2;
    }

    .lead {
      margin: 0 0 28px;
      color: #4f4b42;
      font-size: 1.02rem;
      line-height: 1.75;
    }

    .field { margin: 0 0 18px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 52px;
      border: 2px solid #9a927d;
      border-radius: 13px;
      background: rgba(255,255,255,.94);
      padding: 11px 14px;
      color: var(--ink);
      font-size: 1rem;
    }

    .field-error {
      min-height: 24px;
      margin: 7px 0 0;
      color: var(--red);
      font-weight: 800;
    }

    .rotate-notice {
      display: none;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      border: 2px solid #b76a10;
      border-radius: 14px;
      padding: 11px 13px;
      background: #fff1cf;
      color: #713b06;
      font-weight: 900;
      line-height: 1.45;
    }

    .rotate-icon { flex: 0 0 auto; font-size: 1.55rem; }

    .action-button {
      min-height: 56px;
      max-width: 100%;
      border: 5px solid var(--orange-dark);
      border-radius: 25px;
      padding: 10px 32px;
      background: var(--orange);
      color: #fff;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 4px 0 #743208;
      font-size: 1.05rem;
      font-weight: 900;
      line-height: 1.25;
      cursor: pointer;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .action-button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .action-button:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 1px 0 #743208; }
    .action-button:disabled { cursor: not-allowed; filter: grayscale(.65); opacity: .55; box-shadow: none; }
    .action-button.full { width: 100%; }

    .rules-screen {
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(rgba(255,250,232,.4), rgba(255,250,232,.58)),
        url("背景圖.png") center / cover no-repeat;
    }

    .rules-card {
      width: min(760px, 100%);
      padding: clamp(26px, 5vw, 50px);
      border-radius: 32px;
      background: rgba(255,255,250,.94);
      box-shadow: var(--shadow);
    }

    .hello { margin: 12px 0 24px; color: #66573e; font-size: 1.08rem; }

    .rules-list {
      display: grid;
      gap: 14px;
      margin: 0 0 30px;
      padding: 0;
      list-style: none;
      counter-reset: rules;
    }

    .rules-list li {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 12px;
      align-items: start;
      line-height: 1.65;
      counter-increment: rules;
    }

    .rules-list li::before {
      content: counter(rules);
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--yellow);
      border: 2px solid var(--yellow-border);
      font-weight: 900;
    }

    .game-screen {
      min-height: 100svh;
      padding: 20px clamp(14px, 3vw, 34px) 42px;
      background:
        radial-gradient(circle at top right, rgba(255,214,76,.22), transparent 34%),
        linear-gradient(180deg, #fffaf0 0%, #f5f1e7 100%);
    }

    .game-shell { width: min(1280px, 100%); margin: 0 auto; }

    .game-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 16px;
    }

    .status-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 9px;
    }

    .game-title {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      font-weight: 900;
    }

    .score-pill {
      min-width: 136px;
      border: 3px solid var(--orange-dark);
      border-radius: 999px;
      padding: 9px 15px;
      background: #fff;
      color: var(--orange-dark);
      text-align: center;
      font-weight: 900;
    }

    .heart-meter {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      min-height: 42px;
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 4px 16px rgba(72,42,30,.12);
    }

    .heart-unit {
      position: relative;
      width: 31px;
      height: 33px;
      overflow: hidden;
    }

    .heart-unit::before,
    .heart-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("愛心.png") center / contain no-repeat;
    }

    .heart-unit::before { opacity: .18; filter: grayscale(1); }

    .heart-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--heart-fill, 100%);
      overflow: hidden;
    }

    .heart-fill::before { width: 31px; }

    .progress-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 22px;
    }

    .progress-step {
      height: 9px;
      border-radius: 999px;
      background: #d8d3c8;
    }

    .progress-step.done { background: var(--green); }
    .progress-step.current { background: var(--yellow-strong); box-shadow: 0 0 0 3px rgba(248,185,39,.22); }

    .question-card {
      border: 1px solid #ded6c5;
      border-radius: 28px;
      padding: clamp(18px, 3vw, 30px);
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 38px rgba(71, 56, 26, .1);
    }

    .question-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
    }

    .question-number {
      margin: 0 0 5px;
      color: #9a5a10;
      font-weight: 900;
    }

    .instruction { margin: 9px 0 0; color: var(--muted); line-height: 1.55; }

    .diagram-wrap {
      position: relative;
      width: 100%;
      margin: 18px 0 22px;
      overflow: hidden;
      border: 1px solid #e7dfd0;
      border-radius: 22px;
      background: linear-gradient(180deg, #fff 0%, #fffcf2 100%);
    }

    .diagram-stage {
      position: relative;
      width: 100%;
      min-height: var(--stage-h, 410px);
    }

    .diagram-lines {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .diagram-node {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 2;
      display: grid;
      place-items: center;
      width: clamp(116px, 15vw, 190px);
      min-height: 66px;
      transform: translate(-50%, -50%);
      border: 3px solid var(--yellow-border);
      border-radius: 17px;
      padding: 10px 12px;
      background: var(--yellow);
      color: #171717;
      text-align: center;
      font-size: clamp(.78rem, 1.4vw, 1.03rem);
      font-weight: 800;
      line-height: 1.28;
      box-shadow: 0 4px 0 rgba(154, 107, 0, .13);
    }

    .diagram-node.long { width: clamp(145px, 19vw, 240px); }
    .diagram-node.small { width: clamp(106px, 13vw, 160px); min-height: 56px; }

    @media (min-width: 601px) {
      .diagram-stage.level-2 .diagram-node {
        width: clamp(100px, 11vw, 142px);
        padding-inline: 9px;
        font-size: clamp(.7rem, 1.05vw, .9rem);
      }
      .diagram-stage.level-2 .diagram-node.long { width: clamp(122px, 14vw, 180px); }
      .diagram-stage.level-2 .diagram-node.small { width: clamp(96px, 10.5vw, 136px); }
      .diagram-stage.level-3 .diagram-node.long { width: clamp(130px, 16vw, 205px); }
    }

    .diagram-node.slot {
      border-style: dashed;
      background: #fffef8;
      color: #79683e;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .diagram-node.slot:hover { background: #fff7d6; }
    .diagram-node.slot.selected-target,
    .diagram-node.slot.drag-over { border-color: #1769aa; background: #eaf5ff; transform: translate(-50%, -50%) scale(1.035); }
    .diagram-node.slot.filled { border-style: solid; background: #fff0aa; color: var(--ink); }
    .diagram-node.slot.correct { border-color: var(--green); background: #e4f6e9; color: #15562d; }
    .diagram-node.slot.correct::after { content: "✓"; position: absolute; right: 7px; top: 4px; font-size: 1.1rem; }
    .diagram-node.slot.wrong { border-color: var(--red); background: #ffebe8; animation: shake .34s ease; }

    .slot-hint { font-size: .8rem; font-weight: 800; }

    .answers-section { border-top: 1px solid #e5ddce; padding-top: 20px; }

    .section-title { margin: 0 0 12px; font-size: 1.14rem; }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .answer-card {
      display: grid;
      place-items: center;
      min-height: 126px;
      aspect-ratio: 1 / 1;
      border: 3px solid #b47700;
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(145deg, #ffe990, #ffd250);
      color: #222;
      box-shadow: 0 6px 0 #ae7909, 0 11px 20px rgba(103,72,0,.12);
      text-align: center;
      font-weight: 900;
      line-height: 1.35;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
    }

    .answer-card:hover { filter: brightness(1.03); transform: translateY(-2px); }
    .answer-card:active { cursor: grabbing; }
    .answer-card.selected { border-color: #1769aa; background: #dcefff; box-shadow: 0 0 0 4px rgba(23,105,170,.18), 0 5px 0 #1769aa; transform: translateY(-2px); }
    .answer-card.placed { visibility: hidden; pointer-events: none; }

    .drag-ghost {
      position: fixed;
      z-index: 9999;
      display: grid;
      place-items: center;
      width: 148px;
      min-height: 100px;
      border: 3px solid #1769aa;
      border-radius: 18px;
      padding: 12px;
      background: #fff0a7;
      box-shadow: 0 18px 34px rgba(0,0,0,.23);
      text-align: center;
      font-weight: 900;
      line-height: 1.3;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(-2deg);
    }

    .feedback {
      min-height: 29px;
      margin: 16px 0 4px;
      font-weight: 900;
      text-align: center;
    }

    .feedback.error { color: var(--red); }
    .feedback.success { color: var(--green); }

    .hint-box {
      max-width: 820px;
      margin: 12px auto 0;
      border-left: 6px solid #1769aa;
      border-radius: 12px;
      padding: 12px 15px;
      background: #eaf5ff;
      color: #194d74;
      line-height: 1.6;
    }

    .hint-box strong { display: block; margin-bottom: 4px; }

    .hint-box ul { margin: 0; padding-left: 1.35rem; }

    .save-status {
      min-height: 26px;
      margin: 0 0 18px;
      color: #4d5a4d;
      font-weight: 800;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
    }

    .improvement-screen {
      position: relative;
      display: grid;
      place-items: end center;
      min-height: 100svh;
      padding: clamp(24px, 6vw, 62px);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .improvement-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.02) 25%, rgba(0,0,0,.52) 100%);
    }

    .improvement-card {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      padding: clamp(24px, 5vw, 42px);
      background: rgba(255,253,244,.92);
      box-shadow: 0 22px 70px rgba(0,0,0,.28);
      text-align: center;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      animation: rise .65s ease both;
    }

    .improvement-icon { margin-bottom: 8px; font-size: 2.3rem; }
    .improvement-copy { margin: 14px auto 24px; max-width: 620px; font-size: clamp(1.04rem, 2.5vw, 1.3rem); line-height: 1.75; }

    .complete-screen {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px;
      background:
        linear-gradient(rgba(240,255,239,.28), rgba(240,255,239,.45)),
        url("空氣污染改善-3-環保城市.png") center / cover no-repeat;
    }

    .complete-card {
      width: min(650px, 100%);
      border-radius: 32px;
      padding: clamp(28px, 6vw, 54px);
      background: rgba(255,255,250,.94);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .trophy { font-size: 4.2rem; line-height: 1; }

    .final-score {
      display: inline-grid;
      place-items: center;
      min-width: 180px;
      margin: 22px 0;
      border: 4px solid var(--yellow-border);
      border-radius: 24px;
      padding: 15px 24px;
      background: var(--yellow);
      color: #71470b;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 900;
    }

    .white-fade {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease;
    }

    .white-fade.show { opacity: 1; pointer-events: all; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%); }
      30% { transform: translate(calc(-50% - 7px), -50%); }
      70% { transform: translate(calc(-50% + 7px), -50%); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .answer-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .answer-card { aspect-ratio: auto; min-height: 112px; }
    }

    @media (max-width: 600px) {
      .hero-screen, .rules-screen { padding: 16px; }
      .glass-panel, .rules-card { border-radius: 23px; }
      .game-screen { padding: 14px 10px 34px; }
      .game-header { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
      .status-cluster { align-items: flex-end; }
      .score-pill { min-width: 0; padding: 7px 10px; font-size: .82rem; }
      .heart-meter { gap: 1px; padding: 4px 6px; }
      .heart-unit, .heart-fill::before { width: 25px; }
      .heart-unit { height: 28px; }
      .question-card { padding: 15px 10px 20px; border-radius: 20px; }
      .question-head { display: block; }
      .diagram-stage { min-height: var(--mobile-stage-h, 920px); }
      .diagram-node {
        left: var(--mx);
        top: var(--my);
        width: min(76vw, 250px);
        min-height: 58px;
        font-size: .91rem;
      }
      .diagram-node.long, .diagram-node.small { width: min(76vw, 250px); }
      .answer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .answer-card { min-height: 135px; aspect-ratio: 1 / 1; padding: 10px; font-size: .92rem; }
      .answer-card:nth-child(5) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 5px); }
      .controls { display: grid; grid-template-columns: 1fr; }
      .controls .action-button { width: 100%; }
      .improvement-screen { align-items: end; padding: 16px; }
      .improvement-card { border-radius: 22px; }
    }

    @media (max-width: 1024px) and (orientation: portrait) {
      .rotate-notice { display: flex; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="white-fade" class="white-fade" aria-hidden="true"></div>
  <noscript>此遊戲需要啟用 JavaScript。</noscript>

  <script>
  (() => {
    "use strict";

    const app = document.getElementById("app");
    const liveRegion = document.getElementById("live-region");
    const fadeLayer = document.getElementById("white-fade");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // 部署 Code.gs 後，把 GAS 網頁應用程式的 /exec 網址貼在這裡。
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzKfRrfOQaorBBwPDPpRKoHqAEy-liQPr3p2wcUn9dIrgt0FFv5aZnC5xUI2zpZF6VFKw/exec";

    const copy = {
      "zh-TW": {
        eyebrow: "環境健康評量",
        title: "空氣污染健康影響大挑戰",
        intro: "從污染進入肺部，到影響全身器官，用三題認識空氣污染的健康風險。",
        rotateNotice: "手機或平板建議橫放使用，系統圖會更清楚。",
        name: "姓名",
        namePlaceholder: "請輸入姓名",
        language: "遊戲介面語言",
        start: "開始遊戲",
        nameError: "請輸入姓名後再開始。",
        rulesTitle: "遊戲規則",
        greeting: name => `${name}，你好！請先閱讀遊戲規則。`,
        rules: [
          "將答案拖曳到系統圖的正確空格；也可以先點答案，再點空格。",
          "兩個空格都填滿後，按下確認。",
          "全部答對才能進入下一題；答錯時可以繼續修改。",
          "每答對一個空格得 1 分，每題兩格，三題滿分 6 分。"
        ],
        confirm: "確認",
        gameTitle: "空氣污染健康影響大挑戰",
        questionOf: (n, total) => `第 ${n} 題／共 ${total} 題`,
        score: n => `目前得分：${n}／6`,
        hearts: n => `剩餘愛心：${n} 顆`,
        instruction: "將下方選項拖曳到正確空格，也可以先點答案，再點空格。",
        dropHere: "拖曳到這裡",
        answers: "答案選項",
        reset: "重設本題",
        notFilled: "還有空格尚未完成。",
        wrong: n => `有 ${n} 個位置不正確，再試一次！`,

      locale: "zh-TW",
      currentLevel: 0,
      submissionId: "",
      score: 0,
      heartHalves: 10,
      wrongAttempts: 0,
      activeSlots: [],
      answerOrders: [],
      placements: {},
      awarded: new Set(),
      selectedAnswerId: null,
      wrongSlots: new Set(),
      hints: [],
      feedback: "",
      feedbackType: "",
      isTransitioning: false,
      hasSubmitted: false
    };

    let drag = null;
    let resizeFrame = null;

    function c() { return copy[state.locale] || copy["zh-TW"]; }
    function l(localized) { return localized[state.locale] || localized["zh-TW"]; }
    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
    }
    function shuffle(items) {
      const output = [...items];
      for (let i = output.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [output[i], output[j]] = [output[j], output[i]];
      }
      return output;
    }
    function announce(message) {
      liveRegion.textContent = "";
      requestAnimationFrame(() => { liveRegion.textContent = message; });
    }
    function setDocumentLanguage() {
      document.documentElement.lang = state.locale === "zh-TW" ? "zh-Hant" : state.locale;
      document.title = c().title;
    }

    function initializeRound() {
      state.currentLevel = 0;
      state.submissionId = globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : `game-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      state.score = 0;
      state.heartHalves = 10;
      state.wrongAttempts = 0;
      state.placements = {};
      state.awarded = new Set();
      state.selectedAnswerId = null;
      state.wrongSlots = new Set();
      state.hints = [];
      state.feedback = "";
      state.feedbackType = "";
      state.isTransitioning = false;
      state.hasSubmitted = false;
      state.activeSlots = levels.map(level => shuffle(level.nodes.filter(n => n.eligible).map(n => n.id)).slice(0, 2));
      state.answerOrders = levels.map((level, index) => {
        const correct = state.activeSlots[index].map(nodeId => {
          const node = level.nodes.find(n => n.id === nodeId);
          return { id: node.answerId, text: node.text };
        });
        return shuffle([...correct, ...level.distractors]).map(a => a.id);
      });
      preloadImages();
    }

    function getLevelAnswers(levelIndex) {
      const level = levels[levelIndex];
      const answers = [];
      state.activeSlots[levelIndex].forEach(nodeId => {
        const node = level.nodes.find(n => n.id === nodeId);
        answers.push({ id: node.answerId, text: node.text });
      });
      answers.push(...level.distractors);
      const map = new Map(answers.map(a => [a.id, a]));
      return state.answerOrders[levelIndex].map(id => map.get(id));
    }

    function answerText(answerId) {
      const answer = getLevelAnswers(state.currentLevel).find(a => a.id === answerId);
      return answer ? l(answer.text) : "";
    }

    function currentSlots() {
      const active = state.activeSlots[state.currentLevel] || [];
      return active.map(id => levels[state.currentLevel].nodes.find(n => n.id === id));
    }

    function renderHearts() {
      const accessibleValue = state.heartHalves / 2;
      const hearts = Array.from({ length: 5 }, (_, index) => {
        const remaining = state.heartHalves - index * 2;
        const fill = remaining >= 2 ? 100 : remaining === 1 ? 50 : 0;
        return `<span class="heart-unit" aria-hidden="true"><span class="heart-fill" style="--heart-fill:${fill}%"></span></span>`;
      }).join("");
      return `<div class="heart-meter" role="img" aria-label="${escapeHtml(c().hearts(accessibleValue))}">${hearts}</div>`;
    }

    function renderLogin(error = "") {
      state.screen = "login";
      setDocumentLanguage();
      app.innerHTML = `
        <section class="screen hero-screen" aria-labelledby="login-title">
          <form class="glass-panel" id="login-form" novalidate>
            <p class="eyebrow">${escapeHtml(c().eyebrow)}</p>
            <h1 id="login-title">${escapeHtml(c().title)}</h1>
            <p class="lead">${escapeHtml(c().intro)}</p>
            <div class="rotate-notice" role="note">
              <span class="rotate-icon" aria-hidden="true">↻</span>
              <span>${escapeHtml(c().rotateNotice)}</span>
            </div>
            <div class="field">
              <label for="player-name">${escapeHtml(c().name)}</label>
              <input id="player-name" name="player-name" type="text" maxlength="30" autocomplete="name" value="${escapeHtml(state.playerName)}" placeholder="${escapeHtml(c().namePlaceholder)}" aria-describedby="name-error" aria-invalid="${error ? "true" : "false"}">
              <p id="name-error" class="field-error" role="alert">${escapeHtml(error)}</p>
            </div>
            <div class="field">
              <label for="language">${escapeHtml(c().language)}</label>
              <select id="language" name="language">
                <option value="zh-TW" ${state.locale === "zh-TW" ? "selected" : ""}>中文</option>
                <option value="en" ${state.locale === "en" ? "selected" : ""}>English</option>
                <option value="vi" ${state.locale === "vi" ? "selected" : ""}>Tiếng Việt</option>
              </select>
            </div>
            <button class="action-button full" type="submit">${escapeHtml(c().start)}</button>
          </form>
        </section>`;

      const form = document.getElementById("login-form");
      const input = document.getElementById("player-name");
      const language = document.getElementById("language");
      input.addEventListener("input", () => { state.playerName = input.value; });
      language.addEventListener("change", () => {
        state.playerName = input.value;
        state.locale = ["zh-TW", "en", "vi"].includes(language.value) ? language.value : "zh-TW";
        renderLogin();
        document.getElementById("language").focus();
      });
      form.addEventListener("submit", event => {
        event.preventDefault();
        state.playerName = input.value.trim();
        if (!state.playerName) {
          renderLogin(c().nameError);
          document.getElementById("player-name").focus();
          return;
        }
        initializeRound();
        renderRules();
      });
    }

    function renderRules() {
      state.screen = "rules";
      app.innerHTML = `
        <section class="screen rules-screen" aria-labelledby="rules-title">
          <div class="rules-card">
            <p class="eyebrow">${escapeHtml(c().eyebrow)}</p>
            <h1 id="rules-title">${escapeHtml(c().rulesTitle)}</h1>
            <p class="hello">${escapeHtml(c().greeting(state.playerName))}</p>
            <ol class="rules-list">${c().rules.map(rule => `<li>${escapeHtml(rule)}</li>`).join("")}</ol>
            <button id="rules-confirm" class="action-button full" type="button">${escapeHtml(c().confirm)}</button>
          </div>
        </section>`;
      document.getElementById("rules-confirm").addEventListener("click", () => {
        renderGame();
      });
      document.getElementById("rules-title").setAttribute("tabindex", "-1");
      document.getElementById("rules-title").focus();
    }

    function renderGame(options = {}) {
      state.screen = "game";
      const level = levels[state.currentLevel];
      const active = new Set(state.activeSlots[state.currentLevel]);
      const placedIds = new Set(Object.values(state.placements));
      const allFilled = currentSlots().every(slot => state.placements[slot.id]);
      const answerCards = getLevelAnswers(state.currentLevel);

      app.innerHTML = `
        <section class="screen game-screen" aria-labelledby="question-title">
          <div class="game-shell">
            <header class="game-header">
              <p class="game-title">${escapeHtml(c().gameTitle)}</p>
              <div class="status-cluster">
                ${renderHearts()}
                <div class="score-pill" aria-label="${escapeHtml(c().score(state.score))}">${escapeHtml(c().score(state.score))}</div>
              </div>
            </header>
            <div class="progress-row" aria-hidden="true">
              ${levels.map((_, i) => `<span class="progress-step ${i < state.currentLevel ? "done" : i === state.currentLevel ? "current" : ""}"></span>`).join("")}
            </div>
            <article class="question-card">
              <div class="question-head">
                <div>
                  <p class="question-number">${escapeHtml(c().questionOf(state.currentLevel + 1, levels.length))}</p>
                  <h1 id="question-title">${escapeHtml(l(level.title))}</h1>
                  <p class="instruction">${escapeHtml(c().instruction)}</p>
                </div>
              </div>
              <div class="diagram-wrap">
                <div class="diagram-stage level-${state.currentLevel + 1}" id="diagram-stage" style="--stage-h:${level.height}px;--mobile-stage-h:${level.mobileHeight}px">
                  <svg class="diagram-lines" id="diagram-lines" aria-hidden="true"></svg>
                  ${level.nodes.map(node => renderNode(node, active)).join("")}
                </div>
              </div>
              <section class="answers-section" aria-labelledby="answers-title">
                <h2 class="section-title" id="answers-title">${escapeHtml(c().answers)}</h2>
                <div class="answer-grid">
                  ${answerCards.map(answer => {
                    const placed = placedIds.has(answer.id);
                    const selected = state.selectedAnswerId === answer.id;
                    return `<button type="button" class="answer-card ${placed ? "placed" : ""} ${selected ? "selected" : ""}" data-answer-id="${escapeHtml(answer.id)}" aria-pressed="${selected}" ${placed || state.isTransitioning ? "disabled" : ""}>${formatText(l(answer.text))}</button>`;
                  }).join("")}
                </div>
              </section>
              <p class="feedback ${escapeHtml(state.feedbackType)}" id="feedback" aria-live="polite">${escapeHtml(state.feedback)}</p>
              ${state.hints.length ? `<aside class="hint-box"><strong>💡 ${escapeHtml(c().hintTitle)}</strong><ul>${state.hints.map(hint => `<li>${escapeHtml(hint)}</li>`).join("")}</ul></aside>` : ""}
              <div class="controls">
                <button id="reset-question" class="action-button" type="button" ${state.isTransitioning ? "disabled" : ""}>${escapeHtml(c().reset)}</button>
                <button id="check-answer" class="action-button" type="button" ${!allFilled || state.isTransitioning ? "disabled" : ""}>${escapeHtml(c().confirm)}</button>
              </div>
            </article>
          </div>
        </section>`;

      bindGameEvents();
      scheduleDraw();
      if (options.focusTitle) {
        const title = document.getElementById("question-title");
        title.setAttribute("tabindex", "-1");
        title.focus();
      } else if (options.focusSelector) {
        const target = document.querySelector(options.focusSelector);
        if (target) target.focus();
      }
    }

    function renderNode(node, active) {
      const baseClass = `diagram-node ${node.long ? "long" : ""} ${node.small ? "small" : ""}`;
      const style = `--x:${node.x}%;--y:${node.y}%;--mx:${node.mx}%;--my:${node.my}%`;
      if (!active.has(node.id)) {
        return `<div class="${baseClass}" style="${style}" data-node-id="${escapeHtml(node.id)}">${formatText(l(node.text))}</div>`;
      }
      const placedId = state.placements[node.id];
      const isCorrect = state.awarded.has(node.id);
      const isWrong = state.wrongSlots.has(node.id);
      const display = placedId ? formatText(answerText(placedId)) : `<span class="slot-hint">${escapeHtml(c().dropHere)}</span>`;
      const slotIndex = state.activeSlots[state.currentLevel].indexOf(node.id) + 1;
      const aria = isCorrect ? c().slotCorrectLabel(slotIndex, answerText(placedId)) : placedId ? c().slotFilledLabel(slotIndex, answerText(placedId)) : c().slotEmptyLabel(slotIndex);
      return `<button type="button" class="${baseClass} slot ${placedId ? "filled" : ""} ${isCorrect ? "correct" : ""} ${isWrong ? "wrong" : ""} ${state.selectedAnswerId && !isCorrect ? "selected-target" : ""}" style="${style}" data-node-id="${escapeHtml(node.id)}" data-slot-id="${escapeHtml(node.id)}" aria-label="${escapeHtml(aria)}" ${isCorrect || state.isTransitioning ? "disabled" : ""}>${display}</button>`;
    }

    function formatText(text) {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function bindGameEvents() {
      document.querySelectorAll(".answer-card:not(:disabled)").forEach(card => {
        card.addEventListener("click", onAnswerClick);
        card.addEventListener("pointerdown", onPointerDown);
      });
      document.querySelectorAll(".diagram-node.slot:not(:disabled)").forEach(slot => slot.addEventListener("click", onSlotClick));
      document.getElementById("reset-question").addEventListener("click", resetQuestion);
      document.getElementById("check-answer").addEventListener("click", checkAnswers);
    }

    function onAnswerClick(event) {
      if (event.currentTarget.dataset.suppressClick === "true") {
        event.currentTarget.dataset.suppressClick = "false";
        return;
      }
      const id = event.currentTarget.dataset.answerId;
      state.selectedAnswerId = state.selectedAnswerId === id ? null : id;
      state.feedback = state.selectedAnswerId ? c().selected(answerText(id)) : "";
      state.feedbackType = "";
      renderGame({ focusSelector: state.selectedAnswerId ? `[data-answer-id="${id}"]` : "#answers-title" });
      if (state.selectedAnswerId) announce(c().selected(answerText(id)));
    }

    function onSlotClick(event) {
      const slotId = event.currentTarget.dataset.slotId;
      if (state.awarded.has(slotId)) return;
      if (state.selectedAnswerId) {
        placeAnswer(state.selectedAnswerId, slotId);
      } else if (state.placements[slotId]) {
        const removedText = answerText(state.placements[slotId]);
        delete state.placements[slotId];
        state.wrongSlots.delete(slotId);
        state.hints = [];
        state.feedback = c().removed(removedText);
        state.feedbackType = "";
        renderGame({ focusSelector: `[data-slot-id="${slotId}"]` });
        announce(state.feedback);
      }
    }

    function placeAnswer(answerId, slotId) {
      if (state.awarded.has(slotId) || state.isTransitioning) return;
      Object.keys(state.placements).forEach(existingSlot => {
        if (state.placements[existingSlot] === answerId && !state.awarded.has(existingSlot)) delete state.placements[existingSlot];
      });
      state.placements[slotId] = answerId;
      state.selectedAnswerId = null;
      state.wrongSlots.delete(slotId);
      state.hints = [];
      state.feedback = c().placed(answerText(answerId));
      state.feedbackType = "";
      renderGame({ focusSelector: `[data-slot-id="${slotId}"]` });
      announce(state.feedback);
    }

    function resetQuestion() {
      currentSlots().forEach(slot => {
        if (!state.awarded.has(slot.id)) delete state.placements[slot.id];
      });
      state.selectedAnswerId = null;
      state.wrongSlots = new Set();
      state.hints = [];
      state.feedback = "";
      state.feedbackType = "";
      renderGame({ focusSelector: "#reset-question" });
    }

    function checkAnswers() {
      const slots = currentSlots();
      if (!slots.every(slot => state.placements[slot.id])) {
        state.feedback = c().notFilled;
        state.feedbackType = "error";
        renderGame({ focusSelector: "#check-answer" });
        announce(state.feedback);
        return;
      }

      let newlyCorrect = 0;
      state.wrongSlots = new Set();
      slots.forEach(slot => {
        if (state.awarded.has(slot.id)) return;
        if (state.placements[slot.id] === slot.answerId) {
          state.awarded.add(slot.id);
          state.score += 1;
          newlyCorrect += 1;
        } else {
          state.wrongSlots.add(slot.id);
        }
      });

      const allCorrect = slots.every(slot => state.awarded.has(slot.id));
      if (allCorrect) {
        state.hints = [];
        state.feedback = c().allCorrect(state.currentLevel + 1);
        state.feedbackType = "success";
        state.isTransitioning = true;
        renderGame();
        announce(state.feedback);
        window.setTimeout(transitionToImprovement, reduceMotion.matches ? 40 : 700);
      } else {
        state.heartHalves = Math.max(0, state.heartHalves - 1);
        state.wrongAttempts += 1;
        state.hints = [...state.wrongSlots].map(slotId => {
          const node = levels[state.currentLevel].nodes.find(item => item.id === slotId);
          return node && node.hint ? l(node.hint) : c().instruction;
        });
        const heartNotice = `${c().lostHalfHeart}${state.heartHalves === 0 ? ` ${c().noHearts}` : ""}`;
        state.feedback = `${newlyCorrect ? c().partial : c().wrong(state.wrongSlots.size)} ${heartNotice}`;
        state.feedbackType = newlyCorrect ? "success" : "error";
        renderGame({ focusSelector: "#check-answer" });
        announce(state.feedback);
      }
    }

    function transitionToImprovement() {
      fadeLayer.classList.add("show");
      const delay = reduceMotion.matches ? 20 : 620;
      window.setTimeout(() => {
        renderImprovement();
        requestAnimationFrame(() => requestAnimationFrame(() => fadeLayer.classList.remove("show")));
      }, delay);
    }

    function renderImprovement() {
      state.screen = "improvement";
      state.isTransitioning = false;
      const level = levels[state.currentLevel];
      const isLast = state.currentLevel === levels.length - 1;
      app.innerHTML = `
        <section class="screen improvement-screen" style="background-image:url('${level.image}')" aria-labelledby="improvement-title">
          <div class="improvement-card">
            <div class="improvement-icon" aria-hidden="true">🌿</div>
            <p class="eyebrow">${escapeHtml(c().questionOf(state.currentLevel + 1, levels.length))}</p>
            <h1 id="improvement-title">${escapeHtml(c().improvementTitle[state.currentLevel])}</h1>
            <p class="improvement-copy">${escapeHtml(c().improvementText[state.currentLevel])}</p>
            <button id="improvement-next" class="action-button" type="button">${escapeHtml(isLast ? c().results : c().next)}</button>
          </div>
        </section>`;
      const title = document.getElementById("improvement-title");
      title.setAttribute("tabindex", "-1");
      title.focus();
      document.getElementById("improvement-next").addEventListener("click", () => {
        if (isLast) {
          renderComplete();
        } else {
          state.currentLevel += 1;
          state.placements = {};
          state.selectedAnswerId = null;
          state.wrongSlots = new Set();
          state.hints = [];
          state.feedback = "";
          state.feedbackType = "";
          renderGame({ focusTitle: true });
        }
      });
    }

    function renderComplete() {
      state.screen = "complete";
      app.innerHTML = `
        <section class="screen complete-screen" aria-labelledby="complete-title">
          <div class="complete-card">
            <div class="trophy" aria-hidden="true">🏆</div>
            <p class="eyebrow">${escapeHtml(c().eyebrow)}</p>
            <h1 id="complete-title">${escapeHtml(c().completeTitle)}</h1>
            <p class="improvement-copy">${escapeHtml(c().completeText(state.playerName))}</p>
            <div>
              <span class="sr-only">${escapeHtml(c().finalScore)}</span>
              <div class="final-score" aria-label="${escapeHtml(`${c().finalScore}: ${state.score} / 6`)}">${state.score}／6</div>
            </div>
            <p class="hello">${escapeHtml(c().heartsRemaining(state.heartHalves / 2))}</p>
            <p class="save-status" id="save-status" aria-live="polite"></p>
            <button id="replay" class="action-button" type="button">${escapeHtml(c().replay)}</button>
          </div>
        </section>`;
      const title = document.getElementById("complete-title");
      title.setAttribute("tabindex", "-1");
      title.focus();
      document.getElementById("replay").addEventListener("click", () => {
        initializeRound();
        renderGame({ focusTitle: true });
      });
      submitResult();
    }

    async function submitResult() {
      const status = document.getElementById("save-status");
      if (!status || state.hasSubmitted) return;
      const configured = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(GAS_WEB_APP_URL);
      if (!configured) {
        status.textContent = c().saveNotConfigured;
        return;
      }
      state.hasSubmitted = true;
      status.textContent = c().saving;
      const payload = {
        submissionId: state.submissionId,
        playerName: state.playerName,
        locale: state.locale,
        score: state.score,
        maxScore: 6,
        heartsRemaining: state.heartHalves / 2,
        wrongAttempts: state.wrongAttempts,
        activeSlots: state.activeSlots.map((slots, index) => ({ level: index + 1, slots })),
        completedAt: new Date().toISOString(),
        gameVersion: "1.1"
      };
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          cache: "no-store",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        status.textContent = c().saved;
      } catch (error) {
        state.hasSubmitted = false;
        status.textContent = c().saveFailed;
      }
    }

    function drawConnections() {
      if (state.screen !== "game") return;
      const stage = document.getElementById("diagram-stage");
      const svg = document.getElementById("diagram-lines");
      if (!stage || !svg) return;
      const stageRect = stage.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${stageRect.width} ${stageRect.height}`);
      const level = levels[state.currentLevel];
      let paths = `<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L0,8 L11,4 z" fill="#5f625d"></path></marker></defs>`;
      level.edges.forEach(([fromId, toId]) => {
        const from = stage.querySelector(`[data-node-id="${fromId}"]`);
        const to = stage.querySelector(`[data-node-id="${toId}"]`);
        if (!from || !to) return;
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        let x1, y1, x2, y2, d;
        if (window.innerWidth <= 600) {
          x1 = a.left + a.width / 2 - stageRect.left;
          y1 = a.bottom - stageRect.top;
          x2 = b.left + b.width / 2 - stageRect.left;
          y2 = b.top - stageRect.top;
          const mid = y1 + (y2 - y1) * .5;
          d = `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
        } else {
          const horizontalGap = b.left - a.right;
          const downwardGap = b.top - a.bottom;
          const upwardGap = a.top - b.bottom;
          if (horizontalGap >= 10) {
            x1 = a.right - stageRect.left;
            y1 = a.top + a.height / 2 - stageRect.top;
            x2 = b.left - stageRect.left;
            y2 = b.top + b.height / 2 - stageRect.top;
            const mid = x1 + (x2 - x1) * .5;
            d = `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
          } else if (downwardGap >= 8) {
            x1 = a.left + a.width / 2 - stageRect.left;
            y1 = a.bottom - stageRect.top;
            x2 = b.left + b.width / 2 - stageRect.left;
            y2 = b.top - stageRect.top;
            const mid = y1 + (y2 - y1) * .5;
            d = `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
          } else if (upwardGap >= 8) {
            x1 = a.left + a.width / 2 - stageRect.left;
            y1 = a.top - stageRect.top;
            x2 = b.left + b.width / 2 - stageRect.left;
            y2 = b.bottom - stageRect.top;
            const mid = y1 + (y2 - y1) * .5;
            d = `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`;
          } else {
            x1 = a.right - stageRect.left;
            y1 = a.top + a.height / 2 - stageRect.top;
            x2 = b.left - stageRect.left;
            y2 = b.top + b.height / 2 - stageRect.top;
            const routeY = Math.max(12, Math.min(y1, y2) - 24);
            d = `M ${x1} ${y1} C ${x1 + 18} ${y1}, ${x1 + 18} ${routeY}, ${(x1 + x2) / 2} ${routeY} S ${x2 - 18} ${y2}, ${x2} ${y2}`;
          }
        }
        paths += `<path d="${d}" fill="none" stroke="#5f625d" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>`;
      });
      svg.innerHTML = paths;
    }

    function scheduleDraw() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(drawConnections);
    }

    function onPointerDown(event) {
      if (event.button !== 0 && event.pointerType === "mouse") return;
      const card = event.currentTarget;
      drag = {
        pointerId: event.pointerId,
        answerId: card.dataset.answerId,
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
        card,
        ghost: null,
        target: null
      };
      card.setPointerCapture(event.pointerId);
      card.addEventListener("pointermove", onPointerMove);
      card.addEventListener("pointerup", onPointerUp);
      card.addEventListener("pointercancel", cancelDrag);
    }

    function onPointerMove(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const distance = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
      if (!drag.moved && distance < 7) return;
      if (!drag.moved) {
        drag.moved = true;
        drag.ghost = document.createElement("div");
        drag.ghost.className = "drag-ghost";
        drag.ghost.innerHTML = formatText(answerText(drag.answerId));
        document.body.appendChild(drag.ghost);
      }
      drag.ghost.style.left = `${event.clientX}px`;
      drag.ghost.style.top = `${event.clientY}px`;
      document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
      const hit = document.elementFromPoint(event.clientX, event.clientY);
      const target = hit && hit.closest(".diagram-node.slot:not(:disabled)");
      drag.target = target || null;
      if (drag.target) drag.target.classList.add("drag-over");
    }

    function onPointerUp(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const { moved, target, answerId, card } = drag;
      if (moved) card.dataset.suppressClick = "true";
      cleanupDrag();
      if (moved && target) placeAnswer(answerId, target.dataset.slotId);
    }

    function cancelDrag() { cleanupDrag(); }

    function cleanupDrag() {
      if (!drag) return;
      document.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
      if (drag.ghost) drag.ghost.remove();
      drag.card.removeEventListener("pointermove", onPointerMove);
      drag.card.removeEventListener("pointerup", onPointerUp);
      drag.card.removeEventListener("pointercancel", cancelDrag);
      drag = null;
    }

    function preloadImages() {
      levels.forEach(level => {
        const image = new Image();
        image.onerror = () => announce(c().imageError);
        image.src = level.image;
      });
    }

    window.addEventListener("resize", scheduleDraw, { passive: true });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        cleanupDrag();
        if (state.selectedAnswerId && state.screen === "game") {
          state.selectedAnswerId = null;
          state.feedback = "";
          renderGame();
        }
      }
    });

    renderLogin();
  })();
  </script>
</body>
</html>
